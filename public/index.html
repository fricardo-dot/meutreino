<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">

  <!-- PWA (caminhos relativos — funcionam em subpath) -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#0B0B0F">

  <!-- iOS: permite rodar como app standalone (sem barra do Safari) -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MeuTreino">
  <link rel="apple-touch-icon" href="./icon-1024.png">

  <title>MeuTreino</title>
  <style>
    html, body { background-color: #0B0B0F; margin: 0; padding: 0; height: 100%; }
    #root { display: flex; flex: 1; min-height: 100vh; }
    /* Splash visual enquanto o bundle carrega */
    .app-loading {
      align-items: center;
      justify-content: center;
      color: #B4FF39;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 18px;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div id="root">
    <div class="app-loading">Carregando MeuTreino…</div>
  </div>
  <script>
    // Registra o service worker assim que possível — habilita offline.
    // Caminho relativo ao base href.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('./sw.js').catch(function (err) {
          console.warn('Falha ao registrar service worker:', err);
        });
      });
    }
  </script>
</body>
</html>
