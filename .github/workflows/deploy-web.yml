name: Deploy Web (PWA)

# As actions são fixadas por SHA completo, com a tag no comentário ao lado.
# Motivo: este workflow publica direto em produção com `pages: write` e
# `id-token: write`, e uma tag como @v7 é móvel — se ela for movida ou
# comprometida, o código novo entra no deploy sem revisão. O SHA é imutável.
# O Dependabot (.github/dependabot.yml) abre PR quando há versão nova; ao
# aceitar, atualize o SHA E o comentário da tag juntos.

# Dispara em todo push na main e também manualmente.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Permite publicar no GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Evita múltiplos deploys concorrentes.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build PWA
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Node 20 saiu de suporte. O 24 é o mesmo runtime usado em dev.
          node-version: 24
          # Explícito de propósito: não dependemos da detecção automática
          # de gerenciador que o setup-node passou a fazer da v5 em diante.
          cache: npm

      - name: Install dependencies
        run: npm ci

      # O portão de verificação do projeto (ver CLAUDE.md). Roda ANTES do
      # export: o Metro só transpila, não checa tipos, então sem este passo um
      # erro de tipo era empacotado e publicado direto em produção.
      - name: Typecheck
        run: npx --no-install tsc --noEmit

      # Não existe passo "Setup Expo": o pacote `expo` está em dependencies,
      # então o `npm ci` acima já instala o CLI local. `--no-install` garante
      # que o npx use esse binário e nunca baixe um CLI da rede.
      - name: Build web (com baseUrl do GitHub Pages)
        # O BASE_URL define o subpath do GitHub Pages:
        #   /meutreino  → https://usuario.github.io/meutreino/
        # Substitua "meutreino" pelo nome do repositório se for diferente.
        env:
          BASE_URL: /meutreino
        run: npx --no-install expo export --platform web

      # O GitHub Pages não tem fallback de SPA: abrir uma rota interna direto
      # pela URL (link compartilhado, favorito, F5 numa aba que está em
      # /exercicios) devolvia a página de erro do GitHub em vez do app.
      #
      # Servir uma cópia do index.html como 404.html resolve: o Pages entrega
      # o app em qualquer caminho e o Expo Router assume dali. A resposta sai
      # com status 404, o que é irrelevante aqui e é como todo SPA no Pages faz.
      #
      # A cópia é feita no build, e não versionada em public/, porque o
      # index.html referencia o bundle com hash — que muda a cada build.
      - name: Fallback de SPA (404.html = index.html)
        run: cp dist/index.html dist/404.html

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./dist

  deploy:
    name: Deploy no GitHub Pages
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
