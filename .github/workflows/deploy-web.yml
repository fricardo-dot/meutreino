name: Deploy Web (PWA)

# Dispara em todo push na main e também manualmente.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Permite publicar no GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Evita múltiplos deploys concorrentes.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build PWA
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest

      - name: Install dependencies
        run: npm ci

      - name: Build web (com baseUrl do GitHub Pages)
        # O EXPO_BASE_URL define o subpath do GitHub Pages:
        #   /meutreino  → https://usuario.github.io/meutreino/
        # Substitua "meutreino" pelo nome do repositório se for diferente.
        env:
          EXPO_BASE_URL: /meutreino
        run: npx expo export --platform web

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    name: Deploy no GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
